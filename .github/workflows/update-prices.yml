name: Actualizar precios (petróleo / resinas)

on:
  schedule:
    # 09:15 UTC ≈ 06:15 Chile (CLT) — todos los días
    - cron: "15 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-prices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live prices
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/update_prices.py

      - name: Commit data if changed
        run: |
          git config user.name "etp-price-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/precios.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios."
          else
            git commit -m "chore: actualizar precios de petróleo y resinas [skip ci]"
            git push
          fi
